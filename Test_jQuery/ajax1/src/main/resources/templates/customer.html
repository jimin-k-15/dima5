<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>우수고객 목록</title>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script>
$(function() {
	init();
	$("#regist").on('click', regist);
});

// 데이터 등록하기
function regist() {
	// 1) 데이터 수집
	let name = $("#name").val();
	let phone = $("#phone").val();
	let gender = $("input[type='radio']:checked").val();
	let location = $("#location").val();
	
	let sendData = {"name": name, "phone": phone, "gender": gender, "location": location};
	// alert(JSON.stringify(sendData)); // 확인용 경고창 
	
	// 2) 데이터 전송
	$.ajax({
		url: 'insert',
		method: 'post',
		data: sendData,
		success: function(resp) {  // let resp = 'success';
			if(resp === 'success') {
				clear();
				init();		// DB에 접근해서 모든 데이터를 가져온 후, 화면에 출력
			}
		}
	});
}
// 입력상자 지우기
function clear() {
	$("#name").val('');
	$("#phone").val('');
	$("#location").val('');
}

// 모든 데이터 조회
function init() {
	$.ajax({
		url : 'selectAll',
		method : 'get',
		success : output
	});
}

// 서버로부터 받은 데이터를 화면에 출력
function output(resp) {
	
	// 반복하지 않는 부분과
	let tag = `						 
		<table border="1">
		<tr>
			<th>번호</th>
			<th>이름</th>
			<th>전화번호</th>
			<th>성별</th>
			<th>주소지</th>
			<th></th>
		</tr>`;
		
		// 반복하는 부분을 분리 -> 반복문 안에 넣기
		$.each(resp, function(index, item) {
		tag += `<tr>				
					<td>${index+1}</td>		
					<td>${item["name"]}</td>	 // 자바스크립트 문법			
					<td>${item["phone"]}</td>
					<td>${item["gender"]}</td>
					<td>${item["location"]}</td>
					<td>
						<input type="button" class="delBtn" data-seq="${item['seq']}" value="삭제">	
					</td>
				</tr>`;
		});
			
		tag += `</table>`;
		$('#result').html(tag); 
		$('.delBtn').on('click', delCustomer); 
}

// 고객정보 삭제 함수
function delCustomer() {
	let seq = $(this).attr('data-seq');
	
	if(!confirm("데이터를 삭제하시겠습니까?")) {
		return;
	}
	
	$.ajax({
		url: 'delete',
		method: 'get',
		data: {"seq": seq}, 
		success: init
	});
}

</script>
</head>
<body>
	<h2>[ 고객관리 ]</h2>
	<div id="vip">
		<label>이름: <input type="text" id="name" placeholder="이름"></label>&nbsp;
		<label>전화번호: <input type="text" id="phone" placeholder="전화번호"></label>&nbsp;
		<label>성별: 
			<input type="radio" name="gender" class="gender" value="남성" checked>남성 &nbsp;
			<input type="radio" name="gender" class="gender" value="여성">여성 &nbsp;
		</label>
		<label>주소지:
			<input type="text" id="location" placeholder="주소지">
		</label>
		<input type="button" id="regist" value="등록">
	</div>
	
	<hr>
	<div id="result"></div>

</body>
</html>
