spring.application.name=spring9

# 포트번호 설정
server.port=9898

# DB (MySQL) 연동 설정
spring.datasource.url=jdbc:mysql://localhost:3306/dima5?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=root

# 로그에 출력되는 쿼리 포메팅
spring.jpa.properties.hibernates.format_sql=true
spring.jpa.show-sql=true

spring.jpa.hibernate.ddl-auto=none

spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# 페이징을 위한 설정
user.board.pageLimit=10

# 첨부파일이 있을 때
# 1) 업로드 파일의 용량 제한: default 1M
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# 2) 서버의 HDD의 저장 위치 설정 
spring.servlet.multipart.location=c:/uploadPath

# Predict Server URL
iris.predict.server=http://127.0.0.1:8000/predict






