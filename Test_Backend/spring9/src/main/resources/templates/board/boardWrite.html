<!DOCTYPE html>
<html lang="ko" xmlns:th = "http://thymeleaf.org"
				xmlns:sec = "http://thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>게시글 등록화면</title>
    <link rel="stylesheet" th:href="@{/css/write.css}">
</head>

<body>
	<!-- 로고(fragment 로 대체) -->
	<div class="container" th:insert="~{fragment/header(title='게시글 등록')}"></div>
   
 	<!-- 게시글 등록 화면 -->
	<div class="content">
		<form action="/board/boardWrite" method="POST" enctype="multipart/form-data">
			<table border="1">
				<tr>
					<th>작성자</th>
					<td><!-- 로그인한 사람의 아이디 -->
						<input type="text" id="boardWriter" name="boardWriter" th:value="${#authentication.name}" readonly>
					</td>
				</tr>
				<tr>
					<th>글제목</th>
					<td>
						<input type="text" id="boardTitle" name="boardTitle" required>
					</td>
				</tr>
				<tr>
					<th>글 내용</th>
					<td>
						<textarea id="boardContent" name="boardContent" cols="30" rows="10" required></textarea>
					</td>
				</tr>
				<tr>
					<th>첨부파일</th>
					<td>
						<input id="uploadFile" type="file" class="btn" name="uploadFile"> 
					</td>
				</tr>
				<tr>
					<th colspan="2">
						<input type="submit" value="등록"   class="btn btn-primary"> &nbsp;
						<input type="reset"  value="초기화" class="btn btn-danger">
					</th>
				</tr>
			</table>
		</form>	
	</div> 	
 
</body>

</html>
