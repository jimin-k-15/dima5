<!DOCTYPE html>
<html lang="ko" xmlns:th = "http://thymeleaf.org"
				xmlns:sec = "http://thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>게시글 수정화면</title>
    <link rel="stylesheet" th:href="@{/css/write.css}">
</head>

<body>
	<!-- 로고(fragment 로 대체) -->
	<div class="container" th:insert="~{fragment/header(title='게시글 수정')}"></div>
   
 	<!-- 게시글 수정 화면 -->
	<div class="content">
		<form action="/board/boardUpdate" method="POST" enctype="multipart/form-data">
			<input type="hidden" name="boardSeq" th:value="${board.boardSeq}">
			<input type="hidden" name="boardWriter" th:value="${board.boardWriter}">
			<input type="hidden" name="searchItem" th:value="${searchItem}">
			<input type="hidden" name="searchWord" th:value="${searchWord}">
			<table border="1">
				<tr>
					<th>작성자</th>
					<td><!-- 글쓴 사람의 아이디 -->
						<input type="text" id="boardWriter" th:value="${board.boardWriter}" readonly>
					</td>
				</tr>
				<tr>
					<th>글제목</th>
					<td>
						<input type="text" id="boardTitle" name="boardTitle" th:value="${board.boardTitle}" required>
					</td>
				</tr>
				<tr>
					<th>작성일</th>
					<td>
						<span th:text="${#temporals.format(board.createDate, 'yyyy-MM-dd hh:mm')}"></span>
					</td>
				</tr>
				<tr>
					<th>글 내용</th>
					<td>
						<textarea id="boardContent" name="boardContent" cols="30" rows="10" th:text="${board.boardContent}" required></textarea>
					</td>
				</tr>
				<tr>
					<th>첨부파일</th>
					<td>
						<input type="file" class="btn" name="uploadFile">
						<th:block th:if="${board.originalFilename != null}" th:text="${board.originalFilename}"></th:block> 
					</td>
				</tr>
				<tr>
					<th colspan="2">
						<input type="submit" value="수정"   class="btn btn-primary"> &nbsp;
						<a href="/board/boardList" class="btn">목록</a>
					</th>
				</tr>
			</table>
		</form>	
	</div> 	
 
</body>

</html>
