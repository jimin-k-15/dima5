<!DOCTYPE html>
<html lang="ko" xmlns:th = "http://thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>게시글 자세히 보기</title>
    <link rel="stylesheet" th:href="@{/css/detail.css}">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script defer th:src="@{/js/reply.js}"></script>
</head>

<body>
<!-- 로고 -->
    <div class="container">
    	<div class="logo">
    		<a href="/">
    			<img th:src="@{/images/logo.png}" alt="logo">
    		</a>
    		<h2>게시글 자세히</h2>
    	</div>
    </div>
   
 	<!-- 게시글 자세히 보기 -->
	<div class="content">
			<table border="1">
			<input type="hidden" id="boardSeq" th:value="${board.boardSeq}">
			<input type="hidden" id="replyWriter" value="kildong"> <!-- 수정 : 로그인한 사람의 아이디 -->
				<tr>
					<th>작성자</th>
					<td><!-- 로그인한 사람의 아이디 -->
						<span th:text="${board.boardWriter}">로그인한 사람의 아이디</span>
					</td>
				</tr>
				<tr>
					<th>글제목</th>
					<td>
						<span th:text="${board.boardTitle}">글제목</span>
					</td>
				</tr>
				<tr>
					<th>작성일</th>
					<td>
						<span th:text="${#temporals.format(board.createDate, 'yyyy-MM-dd HH:mm')}">작성일</span>
					</td>
				</tr>
				<tr>
					<th>수정일</th>
					<td>
						<span th:text="${#temporals.format(board.updateDate, 'yyyy-MM-dd HH:mm')}">수정일</span>
					</td>
				</tr>
				<tr>
					<th>글 내용</th>
					<td>
						<pre>[[${board.boardContent}]]</pre>
					</td>
				</tr>
				<tr>
					<th>첨부파일</th>
					<td>
						<th:block th:if="${board.originalFilename != null}">
						<a th:href="@{/board/download(boardSeq=${board.boardSeq})}">
							<span th:text="${board.originalFilename}">첨부파일명</span>
						</a>
						</th:block>
					</td>
				</tr>
				<tr>
					<th colspan="2">
						<a th:href="@{/board/boardUpdate(boardSeq=${board.boardSeq}, searchItem=${searchItem}, searchWord=${searchWord})}" class="btn btn-primary">수정</a>
						<a th:href="@{/board/boardDelete(boardSeq=${board.boardSeq}, searchItem=${searchItem}, searchWord=${searchWord})}" class="btn btn-danger">삭제</a>
						<a href="{/board/boardList(boardSeq=${board.boardSeq}, searchItem=${searchItem}, searchWord=${searchWord})}" class="btn">목록</a>
					</th>
				</tr>
			</table>
			
			<!-- 댓글 화면 -->
			
			<!-- 댓글 입력란 -->
			<div class="reply-write">
				<input type="text" id="replyText" >
				<input type="button" id="replyBtn" class="btn btn-info" value="댓글 입력">
				<input type="button" id="updateBtn" class="btn btn-primary" data-seq="" value="댓글 수정">
			</div>
			
			<!-- 댓글 출력란 -->
			<div id="reply-list"></div>
	</div> 	
 
</body>

</html>
